<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" aria-label="Calculadora">
    <section class="display">
      <div class="expression" id="expression" aria-live="polite"></div>
      <div class="result" id="result" aria-live="polite">0</div>
    </section>

    <section class="keys">
      <button type="button" class="fn" data-action="clear">AC</button>
      <button type="button" class="fn" data-action="backspace" aria-label="Borrar">⌫</button>
      <button type="button" class="fn" data-action="percent">%</button>
      <button type="button" class="op" data-op="/" aria-label="Dividir">÷</button>

      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button type="button" class="op" data-op="*" aria-label="Multiplicar">×</button>

      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button type="button" class="op" data-op="-" aria-label="Restar">−</button>

      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button type="button" class="op" data-op="+" aria-label="Sumar">+</button>

      <button type="button" data-action="sign" aria-label="Cambiar signo">±</button>
      <button type="button" data-digit="0">0</button>
      <button type="button" data-action="decimal">,</button>
      <button type="button" class="equals" data-action="equals" aria-label="Igual">=</button>
    </section>
  </main>

  <script src="calculator.js"></script>
  <script src="app.js"></script>
</body>
</html>
